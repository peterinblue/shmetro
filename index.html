<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World · SHMetro</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --ink: #e8eefc;
      --muted: #93a0b8;
      --accent: #3b82f6;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(59,130,246,.18), transparent 60%),
        radial-gradient(900px 500px at 90% 110%, rgba(34,197,94,.12), transparent 55%),
        var(--bg);
      color: var(--ink);
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent), var(--card);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.35);
      color: var(--ok);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(34,197,94,.18);
    }
    h1 {
      font-size: clamp(28px, 6vw, 40px);
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 8px;
    }
    code {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      background: rgba(59,130,246,.12);
      color: #93c5fd;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.95em;
    }
    .meta {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 13px;
      color: var(--muted);
    }
    .meta strong { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span> Deploy succeeded</div>
    <h1>Hello, World!</h1>
    <p>这是 <code>peterinblue/shmetro</code> 的测试页面。</p>
    <p>GitHub Pages 已成功部署。</p>
    <div class="meta">
      Repo: <strong>peterinblue/shmetro</strong><br />
      Branch: <strong>main</strong> · Path: <strong>/</strong>
    </div>
  </main>
</body>
</html>
